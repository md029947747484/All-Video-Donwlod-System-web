<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e17">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Fx Sharaf • Sound FX</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0a0e17;color:#f2f5fb}
body{font-family:'Sora','Noto Sans Bengali',system-ui,-apple-system,sans-serif}
button,input,select{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:none}
input,select{background:none}
::selection{background:#2fd9f255;color:#fff}

:root{
  --bg:#0a0e17;
  --surface:#131828;
  --surface-hi:#1a2136;
  --surface-2:#1c2438;
  --border:#262f47;
  --border-soft:#1c2438;
  --text:#f2f5fb;
  --dim:#8d96ac;
  --faint:#5c6580;
  --cyan:#2fd9f2;
  --blue:#3e7bfa;
  --gold:#f2b33d;
  --gold-deep:#c6862a;
  --violet:#a98cff;
  --rose:#fb7c8d;
  --green:#33d186;
  --r-lg:22px;
  --r-md:16px;
  --r-sm:12px;
  --grad-brand:linear-gradient(135deg,var(--cyan),var(--blue));
  --grad-go:linear-gradient(135deg,#3fe0a0,#12a868);
  --grad-gold:linear-gradient(135deg,#f9d77e,#e9a736 55%,#c6862a);
}

@media (prefers-reduced-motion:no-preference){
  .app{animation:rise .5s cubic-bezier(.2,.7,.2,1)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}

body{position:relative;overflow-x:hidden}
body::before,body::after{content:'';position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.16;z-index:0;pointer-events:none}
body::before{background:var(--cyan);top:-20vmax;left:-18vmax}
body::after{background:var(--violet);bottom:-24vmax;right:-20vmax}

.app{position:relative;z-index:1;min-height:100vh;max-width:900px;margin:auto}

.icon{display:block;flex:none}

/* header */
.top{height:72px;background:#0a0e17cc;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--border-soft)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;letter-spacing:-.02em}
.brand img{width:36px;height:36px;filter:drop-shadow(0 0 14px #2fd9f255)}
.brand b{background:linear-gradient(90deg,#fff,#c7d3ea);-webkit-background-clip:text;background-clip:text;color:transparent}
.top-actions{display:flex;align-items:center;gap:9px}
.icon-btn{width:40px;height:40px;border-radius:13px;background:var(--surface);border:1px solid var(--border-soft);color:var(--dim);display:grid;place-items:center;transition:border-color .15s,color .15s}
.icon-btn:active{transform:scale(.94)}
.coin{background:linear-gradient(180deg,#241b0c,#1a1408);border:1px solid #4a370f;color:var(--gold);padding:8px 13px 8px 10px;border-radius:20px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.coin svg{color:var(--gold)}

/* hero */
.hero{padding:22px 18px 10px}
.install{width:100%;padding:16px 18px;border-radius:var(--r-md);background:var(--grad-go);display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 14px 30px -10px #12a86866;color:#05130b}
.install .t{text-align:left}
.install b{display:block;font-weight:800;font-size:16px}
.install span{display:block;font-size:12px;font-weight:500;opacity:.75;margin-top:1px}
.search{margin-top:14px;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--r-md);padding:13px 15px;display:flex;gap:10px;align-items:center}
.search svg{color:var(--faint)}
.search input{border:0;outline:0;width:100%;font-size:15px;background:transparent;color:var(--text)}
.search input::placeholder{color:var(--faint)}
.search:focus-within{border-color:#2fd9f266;box-shadow:0 0 0 3px #2fd9f21f}

.section{padding:10px 18px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 14px}
.section-head h2{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.small{color:var(--cyan);font-weight:600;font-size:13px}

.chips{display:flex;gap:8px;overflow:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:9px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--border-soft);white-space:nowrap;color:var(--dim);font-size:13.5px;font-weight:600}
.chip.active{background:var(--grad-brand);color:#04141c;border-color:transparent;box-shadow:0 8px 18px -6px #2fd9f255}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.card{background:linear-gradient(180deg,var(--surface-hi),var(--surface));border:1px solid var(--border-soft);border-radius:var(--r-lg);padding:12px;box-shadow:0 18px 30px -20px #000a}
.card:active{transform:scale(.98)}

.art{position:relative;height:112px;border-radius:var(--r-md);overflow:hidden;background:radial-gradient(circle at 50% 30%,#161d30,#0c1120);display:grid;place-items:center}
.art::before{content:'';position:absolute;inset:-30%;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--accent) 60%,transparent) 0%,transparent 62%);filter:blur(14px);opacity:.6}
.art.cat-ui{--accent:#2fd9f2}
.art.cat-premium{--accent:#f2b33d}
.art.cat-trans{--accent:#a98cff}
.art.cat-game{--accent:#fb7c8d}
.wave{position:absolute;inset:14% 8%;width:84%;height:72%;overflow:visible}
.wave rect{fill:var(--accent);opacity:.8}
.play{position:relative;z-index:2;width:50px;height:50px;border-radius:50%;background:#fff;color:#0b1220;display:grid;place-items:center;box-shadow:0 8px 20px -4px #000b;transition:transform .12s,box-shadow .2s}
.play:active{transform:scale(.9)}
.play .eq{display:none}
.play.playing{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent,#2fd9f2) 55%,transparent),0 8px 20px -4px #000b}
.play.playing svg{display:none}
.play.playing .eq{display:flex}
.eq{align-items:flex-end;gap:3px;height:18px}
.eq i{width:3px;background:currentColor;border-radius:2px;animation:eqbar .85s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s}
.eq i:nth-child(3){animation-delay:.3s}
@keyframes eqbar{0%,100%{height:5px}50%{height:17px}}
.art.playing{outline:2px solid var(--accent);outline-offset:-2px}
.card:has(.art.playing){border-color:color-mix(in srgb,var(--accent,#2fd9f2) 50%,var(--border-soft))}
@media (prefers-reduced-motion:reduce){.eq i{animation:none;height:11px}}
.ribbon{position:absolute;top:9px;left:9px;z-index:2;background:var(--grad-gold);color:#241a05;font-size:10.5px;font-weight:800;padding:4px 8px 4px 6px;border-radius:999px;display:flex;align-items:center;gap:3px;box-shadow:0 6px 14px -4px #00000066}

.tag{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:11.5px;font-weight:600;margin:11px 1px 0}
.tag .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan)}
h3{margin:0}
.card h3{font-size:15px;font-weight:700;margin:5px 1px 11px;min-height:38px;line-height:1.35;letter-spacing:-.005em}
.meta{display:flex;gap:6px}
.mini{flex:1;border-radius:11px;padding:8px 4px;background:var(--surface-2);border:1px solid var(--border-soft);color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:4px}
.mini svg{color:inherit}
.mini b{font-size:10.5px;font-weight:600}
.mini.active{color:var(--rose);border-color:#fb7c8d3d;background:#fb7c8d14}

/* bottom nav */
.bottom{position:sticky;bottom:0;background:#0a0e17cc;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border-soft);display:grid;grid-template-columns:repeat(5,1fr);padding:9px 6px calc(9px + env(safe-area-inset-bottom));z-index:20;gap:4px}
.nav{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--faint);font-size:10.5px;font-weight:700;padding:6px 2px;border-radius:14px}
.nav svg{color:inherit}
.nav.active{color:var(--cyan);background:#2fd9f21a}

/* modal / sheet */
.modal{position:fixed;inset:0;background:#04070dcc;backdrop-filter:blur(3px);z-index:50;display:none;align-items:flex-end}
.modal.show{display:flex}
.sheet{position:relative;background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:14px 20px 26px;border:1px solid var(--border-soft);border-bottom:0;box-shadow:0 -20px 60px -20px #000c}
.sheet-handle{width:38px;height:4px;border-radius:3px;background:var(--border);margin:2px auto 14px}
.close{position:absolute;top:14px;right:16px;width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--border-soft);color:var(--dim);display:grid;place-items:center}
.sheet h2{margin:4px 30px 18px 0;font-size:21px;font-weight:700;letter-spacing:-.01em}

.form label{display:block;font-weight:600;margin:14px 0 7px;font-size:13.5px;color:var(--dim)}
.form input,.form select{width:100%;padding:14px 15px;border:1px solid var(--border-soft);border-radius:13px;outline:0;background:var(--surface);color:var(--text)}
.form input:focus,.form select:focus{border-color:#2fd9f266;box-shadow:0 0 0 3px #2fd9f21f}
.form input::placeholder{color:var(--faint)}

.primary{width:100%;padding:15px;border-radius:13px;background:var(--grad-brand);color:#04141c;font-weight:800;margin-top:17px;display:flex;align-items:center;justify-content:center;gap:9px;font-size:15px}
.primary:active{transform:scale(.98)}
.primary.outline{background:var(--surface);color:var(--text);border:1px solid var(--border-soft);font-weight:700}
.primary.outline.active{color:var(--rose);border-color:#fb7c8d3d;background:#fb7c8d14}
.primary.danger{background:#3a1418;color:#ff8b93;border:1px solid #6c2530}

.detail-art{height:190px;border-radius:var(--r-lg);margin-top:6px}
.download{display:flex;align-items:center;justify-content:center;gap:9px;text-align:center;text-decoration:none;padding:15px;border-radius:13px;background:var(--grad-go);color:#05130b;font-weight:800;margin-top:16px}
.detail-meta{display:flex;align-items:center;gap:14px;margin-top:8px}
.views{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:13px;font-weight:600}
.notice{padding:13px 14px;border-radius:14px;background:#2a2109;border:1px solid #4a370f;color:#e0b862;font-size:12.5px;line-height:1.55;margin-top:16px;display:flex;gap:10px;align-items:flex-start}
.notice svg{flex:none;margin-top:2px;color:var(--gold)}

.profile{display:flex;gap:14px;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--border-soft);border-radius:18px;margin-bottom:6px}
.avatar{width:52px;height:52px;border-radius:16px;background:var(--grad-brand);display:grid;place-items:center;color:#04141c;font-size:22px;font-weight:800;flex:none;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}
.profile b{display:block;font-size:15px}
.profile span{display:block;color:var(--dim);font-size:12.5px;margin-top:2px}

.empty{text-align:center;padding:44px 20px;color:var(--faint)}
.empty svg{margin-bottom:10px;opacity:.6}
.empty p{margin:0;font-size:14px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#161d30;border:1px solid var(--border-soft);color:#fff;padding:11px 18px;border-radius:12px;z-index:100;display:none;font-size:13.5px;font-weight:600;box-shadow:0 12px 30px -8px #000a}
.toast.show{display:block}

@media(min-width:700px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(900px,100%)}
  body{padding-bottom:74px}
}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><img src="icon.svg" alt=""><b>Fx Sharaf</b></div>
  <div class="top-actions">
    <span class="coin" id="coinIcon">50</span>
    <button class="icon-btn" onclick="openProfile()" aria-label="Settings"></button>
  </div>
</header>

<main>
<section class="hero">
  <button class="install" id="installBtn">
    <div class="t"><b>ইনস্টল করুন</b><span>হোম স্ক্রিনে যোগ করে দ্রুত এক্সেস করুন</span></div>
  </button>
  <div class="search"><input id="search" placeholder="সাউন্ড খুঁজুন..." oninput="render()"></div>
</section>

<section class="section">
  <div class="section-head"><h2>Categories</h2><span class="small" onclick="setCat('All')">সব দেখুন</span></div>
  <div class="chips" id="chips"></div>
</section>

<section class="section">
  <div class="section-head"><h2 id="sectionTitle">Latest Sounds</h2><span class="small" id="count"></span></div>
  <div class="grid" id="grid"></div>
</section>
</main>

<nav class="bottom">
 <button class="nav active" onclick="goHome(this)" id="navHome"></button>
 <button class="nav" onclick="setCat('UI');scrollTop()" id="navCat"></button>
 <button class="nav" onclick="setCat('Premium');scrollTop()" id="navTrend"></button>
 <button class="nav" onclick="showSaved()" id="navSaved"></button>
 <button class="nav" onclick="openProfile()" id="navProfile"></button>
</nav>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- icon set (hand-drawn, currentColor line icons) ---------- */
const ICONS = {
 home:'<path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/>',
 grid:'<rect x="4" y="4" width="6.3" height="6.3" rx="1.6"/><rect x="13.7" y="4" width="6.3" height="6.3" rx="1.6"/><rect x="4" y="13.7" width="6.3" height="6.3" rx="1.6"/><rect x="13.7" y="13.7" width="6.3" height="6.3" rx="1.6"/>',
 trend:'<polyline points="4,16 9.5,10.5 13,14 20,7"/><polyline points="14.5,7 20,7 20,12.5"/>',
 bookmark:'<path d="M6.5 3.5h11a1 1 0 0 1 1 1V21l-6.5-4.3L5.5 21V4.5a1 1 0 0 1 1-1Z"/>',
 sliders:'<line x1="4" y1="7" x2="20" y2="7"/><circle cx="9.5" cy="7" r="2"/><line x1="4" y1="12.5" x2="20" y2="12.5"/><circle cx="15.5" cy="12.5" r="2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="11" cy="18" r="2"/>',
 search:'<circle cx="10.3" cy="10.3" r="6.3"/><line x1="20" y1="20" x2="15" y2="15"/>',
 download:'<path d="M12 3.5v11"/><polyline points="7,10 12,14.5 17,10"/><path d="M4.5 18.5h15"/>',
 heart:'<path d="M12 20s-7.2-4.4-9.6-8.7C.7 8 2.3 4.2 6 4.2c2.1 0 3.7 1.2 6 3.7 2.3-2.5 3.9-3.7 6-3.7 3.7 0 5.3 3.8 3.6 7.1C19.2 15.6 12 20 12 20Z"/>',
 eye:'<path d="M2.5 12S6.5 5.3 12 5.3 21.5 12 21.5 12 17.5 18.7 12 18.7 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/>',
 play:'<polygon points="6,4.5 19,12 6,19.5"/>',
 x:'<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>',
 lock:'<rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"/>',
 userplus:'<circle cx="9.5" cy="8.3" r="3.3"/><path d="M3.2 20c0-3.8 2.9-5.8 6.3-5.8s6.3 2 6.3 5.8"/><line x1="18.5" y1="8.7" x2="18.5" y2="14.3"/><line x1="15.7" y1="11.5" x2="21.3" y2="11.5"/>',
 login:'<path d="M14.5 4.5H19a1 1 0 0 1 1 1V18a1 1 0 0 1-1 1h-4.5"/><path d="M11 8.3 15 12l-4 3.7"/><line x1="15" y1="12" x2="3" y2="12"/>',
 coin:'<circle cx="12" cy="12" r="8.3"/><path d="M9.3 15V9m0 0h2.6a1.9 1.9 0 1 1 0 3.8H9.3m0 0h2.9a1.9 1.9 0 1 1 0 3.8H9.3"/>'
};
function svgIcon(name,size=20,fill='none',stroke='currentColor'){
 return `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="${fill}" stroke="${stroke}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`
}

/* ---------- data ---------- */
const SEED = [{"id": "seed-1", "name": "Tech UI Sounds", "file": "assets/audio/sound-1.mp3", "category": "UI", "seed": true}, {"id": "seed-2", "name": "Premium SFX Pack 01", "file": "assets/audio/sound-2.mp3", "category": "Premium", "seed": true}, {"id": "seed-3", "name": "Premium SFX Pack 02", "file": "assets/audio/sound-3.mp3", "category": "Premium", "seed": true}, {"id": "seed-4", "name": "Crisp Transition SFX", "file": "assets/audio/sound-4.mp3", "category": "Transition", "seed": true}, {"id": "seed-5", "name": "Free UI Button Sounds", "file": "assets/audio/sound-5.mp3", "category": "UI", "seed": true}];
let sounds = SEED.slice();
let users = JSON.parse(localStorage.getItem('lyunaUsers') || '[]');
let currentCat='All', deferredPrompt=null;
let dbPromise=null;
let customMeta=[];
let notificationChannel=null;

const DB_NAME='fx-sharaf-db', DB_VERSION=1, AUDIO_STORE='audio';
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise=new Promise((resolve,reject)=>{
    const r=indexedDB.open(DB_NAME,DB_VERSION);
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(AUDIO_STORE))r.result.createObjectStore(AUDIO_STORE)};
    r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
  });
  return dbPromise;
}
async function putAudioBlob(id,blob){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(AUDIO_STORE,'readwrite'); tx.objectStore(AUDIO_STORE).put(blob,id);
    tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
  });
}
async function getAudioBlob(id){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(AUDIO_STORE,'readonly'); const r=tx.objectStore(AUDIO_STORE).get(id);
    r.onsuccess=()=>resolve(r.result||null); r.onerror=()=>reject(r.error);
  });
}
async function deleteAudioBlob(id){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(AUDIO_STORE,'readwrite'); tx.objectStore(AUDIO_STORE).delete(id);
    tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
  });
}
async function hydrateCustomSounds(){
  customMeta=JSON.parse(localStorage.getItem('fxCustomMeta')||'[]');
  // Migrate old localStorage custom sounds if this app was previously used.
  const old=JSON.parse(localStorage.getItem('lyunaSounds')||'null');
  if(Array.isArray(old)){
    for(const item of old.filter(x=>!x.seed && typeof x.file==='string' && x.file.startsWith('data:'))){
      try{
        const blob=await (await fetch(item.file)).blob();
        await putAudioBlob(item.id,blob);
        if(!customMeta.some(x=>x.id===item.id)) customMeta.push({id:item.id,name:item.name,category:item.category,views:item.views||0});
      }catch(e){}
    }
    localStorage.removeItem('lyunaSounds');
    saveData();
  }
  const loaded=[];
  for(const m of customMeta){
    const blob=await getAudioBlob(m.id).catch(()=>null);
    if(blob) loaded.push({...m,seed:false,file:URL.createObjectURL(blob)});
  }
  sounds=SEED.concat(loaded);
}
async function notifyNewSound(name){
  const title='Fx Sharaf • New Music';
  const body='নতুন music যোগ হয়েছে: '+name;
  if('serviceWorker' in navigator){
    try{
      const reg=await navigator.serviceWorker.ready;
      if(Notification.permission==='granted') await reg.showNotification(title,{body,icon:'icon.svg',badge:'icon.svg',tag:'fx-new-sound-'+Date.now(),silent:false,data:{url:'./'}});
    }catch(e){}
  }
  try{notificationChannel?.postMessage({type:'new-sound',name})}catch(e){}
}
async function requestNotificationPermission(){
  if(!('Notification' in window)) return;
  if(Notification.permission==='default' && !localStorage.getItem('fxNotifAsked')){
    localStorage.setItem('fxNotifAsked','1');
    try{await Notification.requestPermission()}catch(e){}
  }
}
async function initStorage(){
  await hydrateCustomSounds();
  renderChips(); render();
  setTimeout(requestNotificationPermission,700);
}
let currentAudio=null, currentPlayingId=null;

function saveData(){localStorage.setItem('fxCustomMeta',JSON.stringify(customMeta))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'})}

/* ---------- category helpers ---------- */
function catClass(cat){return {UI:'cat-ui',Premium:'cat-premium',Transition:'cat-trans',Game:'cat-game'}[cat]||'cat-ui'}
function catLabel(cat){return {UI:'UI',Premium:'Premium',Transition:'Transition',Game:'Game'}[cat]||cat}

/* deterministic pseudo-waveform per sound, so each card has a distinct visual signature */
function wave(seed,n=26){
 let h=0;for(let i=0;i<seed.length;i++){h=(h*31+seed.charCodeAt(i))>>>0}
 let bars='';
 const w=100/n;
 for(let i=0;i<n;i++){
  const r=((h>>>(i%20))^(h*(i*13+7)))>>>0;
  const hgt=20+(r%76);
  const y=(100-hgt)/2;
  bars+=`<rect x="${(i*w).toFixed(2)}" y="${y.toFixed(2)}" width="${(w*0.55).toFixed(2)}" height="${hgt.toFixed(2)}" rx="1.4"/>`
 }
 return `<svg class="wave" viewBox="0 0 100 100" preserveAspectRatio="none">${bars}</svg>`
}

function setCat(c){currentCat=c; renderChips();render(); document.getElementById('sectionTitle').textContent = c==='All' ? 'Latest Sounds' : c+' Sounds'}
function renderChips(){document.getElementById('chips').innerHTML=['All','UI','Premium','Transition','Game'].map(c=>`<button class="chip ${c===currentCat?'active':''}" onclick="setCat('${c}')">${c==='All'?'সব':c}</button>`).join('')}
function filtered(){
 const q=document.getElementById('search').value.trim().toLowerCase();
 return sounds.filter(s=>(currentCat==='All'||s.category===currentCat)&&(!q||s.name.toLowerCase().includes(q)))
}
function emptyState(msg){return `<div class="empty" style="grid-column:1/-1">${svgIcon('search',30,'none','#5c6580')}<p>${msg}</p></div>`}

function cardHTML(s,saved){
 const cc=catClass(s.category), isSaved=saved.includes(s.id);
 return `<article class="card" onclick="openSound('${s.id}')">
   <div class="art ${cc}" data-art="${s.id}">${wave(s.id)}
     <button class="play" data-play="${s.id}" onclick="event.stopPropagation();playSound('${s.id}')" aria-label="Play">${svgIcon('play',20,'currentColor','none')}<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span></button>
     ${s.category==='Premium'?`<span class="ribbon">${svgIcon('coin',11,'currentColor','none')}Premium</span>`:''}
   </div>
   <span class="tag"><i class="dot"></i>${catLabel(s.category)}</span>
   <h3>${esc(s.name)}</h3>
   <div class="meta">
    <button class="mini ${isSaved?'active':''}" onclick="event.stopPropagation();toggleSave('${s.id}')"><span>${svgIcon('heart',16,isSaved?'currentColor':'none')}</span><b>Save</b></button>
    <button class="mini" onclick="event.stopPropagation();openSound('${s.id}')"><span>${svgIcon('eye',16)}</span><b>Preview</b></button>
    <button class="mini" onclick="event.stopPropagation();downloadSound('${s.id}')"><span>${svgIcon('download',16)}</span><b>Get</b></button>
   </div>
 </article>`
}

function render(){
 const arr=filtered();document.getElementById('count').textContent=arr.length+' sounds';
 const grid=document.getElementById('grid');
 if(!arr.length){grid.innerHTML=emptyState('কোনো sound পাওয়া যায়নি।');return}
 const saved=JSON.parse(localStorage.getItem('lyunaSaved')||'[]');
 grid.innerHTML=arr.map(s=>cardHTML(s,saved)).join('')
 if(currentPlayingId)setPlayingUI(currentPlayingId,true)
}
function findSound(id){return sounds.find(x=>x.id===id)}
function setPlayingUI(id,on){
 document.querySelectorAll(`[data-art="${id}"]`).forEach(el=>el.classList.toggle('playing',on));
 document.querySelectorAll(`[data-play="${id}"]`).forEach(el=>el.classList.toggle('playing',on));
}
function clearAllPlayingUI(){
 document.querySelectorAll('.art.playing').forEach(el=>el.classList.remove('playing'));
 document.querySelectorAll('.play.playing').forEach(el=>el.classList.remove('playing'));
}
function playSound(id){
 const s=findSound(id); if(!s)return;
 if(currentAudio){try{currentAudio.pause()}catch(e){}}
 clearAllPlayingUI();
 const a=new Audio(s.file);
 currentAudio=a; currentPlayingId=id;
 setPlayingUI(id,true);
 a.play().catch(()=>{toast('Play করতে browser permission দিন');if(currentPlayingId===id){setPlayingUI(id,false);currentPlayingId=null;currentAudio=null}});
 a.onended=()=>{if(currentPlayingId===id){setPlayingUI(id,false);currentPlayingId=null;currentAudio=null}};
 toast('▶ '+s.name);
}
function downloadSound(id){
 const s=findSound(id);if(!s)return;
 const a=document.createElement('a');a.href=s.file;a.download=s.name+'.mp3';document.body.appendChild(a);a.click();a.remove();
 toast('ডাউনলোড শুরু হয়েছে');
}
function toggleSave(id){
 let saved=JSON.parse(localStorage.getItem('lyunaSaved')||'[]');
 saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem('lyunaSaved',JSON.stringify(saved));toast(saved.includes(id)?'Saved ✓':'Removed');render()
}
function openSound(id){
 const s=findSound(id);if(!s)return;
 s.views=(s.views||0)+1;saveData();
 const saved=JSON.parse(localStorage.getItem('lyunaSaved')||'[]'), isSaved=saved.includes(id), cc=catClass(s.category);
 document.getElementById('sheet').innerHTML=`<div class="sheet-handle"></div>
 <button class="close" onclick="closeModal()" aria-label="Close">${svgIcon('x',17)}</button>
 <div class="art detail-art ${cc}" data-art="${s.id}">${wave(s.id,38)}<button class="play" data-play="${s.id}" onclick="playSound('${s.id}')" aria-label="Play">${svgIcon('play',24,'currentColor','none')}<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span></button>${s.category==='Premium'?`<span class="ribbon">${svgIcon('coin',11,'currentColor','none')}Premium</span>`:''}</div>
 <h2>${esc(s.name)}</h2>
 <div class="detail-meta"><span class="tag"><i class="dot"></i>${catLabel(s.category)}</span><span class="views">${svgIcon('eye',15)}${s.views} views</span></div>
 <a class="download" href="${s.file}" download="${esc(s.name)}.mp3">${svgIcon('download',18,'currentColor','none')}Download Sound</a>
 <button class="primary outline ${isSaved?'active':''}" id="saveDetailBtn" onclick="toggleSaveDetail('${s.id}')">${svgIcon('heart',18,isSaved?'currentColor':'none')}<span>${isSaved?'Saved to Favorites':'Save to Favorites'}</span></button>`;
 if(currentPlayingId===id)setPlayingUI(id,true)
 showModal()
}
function toggleSaveDetail(id){
 toggleSave(id);
 const saved=JSON.parse(localStorage.getItem('lyunaSaved')||'[]'), isSaved=saved.includes(id);
 const btn=document.getElementById('saveDetailBtn');
 if(btn){btn.classList.toggle('active',isSaved);btn.innerHTML=`${svgIcon('heart',18,isSaved?'currentColor':'none')}<span>${isSaved?'Saved to Favorites':'Save to Favorites'}</span>`}
}
function showModal(){document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()})

function openProfile(){
 document.getElementById('sheet').innerHTML=`<div class="sheet-handle"></div>
 <button class="close" onclick="closeModal()" aria-label="Close">${svgIcon('x',17)}</button>
 <h2>Profile & Settings</h2>
 <div class="profile"><div class="avatar">L</div><div><b>Fx Sharaf</b><span>Sound FX Library</span></div></div>
 <button class="primary outline" onclick="adminLogin()">${svgIcon('lock',18)}<span>Admin Panel</span></button>
 <button class="primary outline" onclick="register()">${svgIcon('userplus',18)}<span>Registration</span></button>
 <button class="primary outline" onclick="login()">${svgIcon('login',18)}<span>Login</span></button>
 <div class="notice">${svgIcon('sliders',16)}<span>নতুন sound যোগ হলে এই ডিভাইসের system notification-এ Fx Sharaf-এর notification যাবে। Audio files IndexedDB-তে রাখা হয়, তাই আগের মতো ৪টির সীমা নেই।</span></div>`;
 showModal()
}
function register(){
 document.getElementById('sheet').innerHTML=`<div class="sheet-handle"></div><button class="close" onclick="openProfile()" aria-label="Back">${svgIcon('x',17)}</button><h2>রেজিস্ট্রেশন করুন</h2>
 <div class="form"><label>ইউজার নাম</label><input id="rUser" placeholder="ইউনিক ইউজার নাম">
 <label>ইমেইল</label><input id="rEmail" type="email" placeholder="আপনার ইমেইল">
 <label>নম্বর</label><input id="rPhone" placeholder="আপনার মোবাইল নম্বর">
 <label>পাসওয়ার্ড</label><input id="rPass" type="password" placeholder="একটি শক্ত পাসওয়ার্ড">
 <button class="primary" onclick="doRegister()">রেজিস্টার</button></div>`;
}
function doRegister(){
 const u=rUser.value.trim(),p=rPass.value, e=rEmail.value.trim(), ph=rPhone.value.trim();
 if(!u||!p||!e||!ph)return toast('সব তথ্য দিন');
 if(users.some(x=>x.user===u))return toast('এই ইউজার নাম আগে আছে');
 users.push({user:u,email:e,phone:ph,pass:p});localStorage.setItem('lyunaUsers',JSON.stringify(users));toast('Registration সফল ✓');login()
}
function login(){
 document.getElementById('sheet').innerHTML=`<div class="sheet-handle"></div><button class="close" onclick="openProfile()" aria-label="Back">${svgIcon('x',17)}</button><h2>লগইন করুন</h2>
 <div class="form"><label>ইউজার নাম</label><input id="lUser" placeholder="আপনার ইউজার নাম">
 <label>পাসওয়ার্ড</label><input id="lPass" type="password" placeholder="আপনার পাসওয়ার্ড">
 <button class="primary" onclick="doLogin()">লগইন</button></div>`;
}
function doLogin(){
 const u=lUser.value.trim(),p=lPass.value;
 const ok=users.find(x=>x.user===u&&x.pass===p);if(!ok)return toast('ইউজার নাম/পাসওয়ার্ড ভুল');toast('লগইন সফল ✓');closeModal()
}
function adminLogin(){
 document.getElementById('sheet').innerHTML=`<div class="sheet-handle"></div><button class="close" onclick="openProfile()" aria-label="Back">${svgIcon('x',17)}</button><h2>Admin Access</h2>
 <div class="form"><label>Admin Password</label><input id="aPass" type="password" placeholder="Password দিন">
 <button class="primary" onclick="checkAdmin()">Enter Admin Panel</button></div>`;
}
function checkAdmin(){if(aPass.value!=='1028')return toast('Password ভুল');adminPanel()}
function adminPanel(){
 document.getElementById('sheet').innerHTML=`<div class="sheet-handle"></div><button class="close" onclick="openProfile()" aria-label="Back">${svgIcon('x',17)}</button><h2>Admin Panel</h2>
 <div class="form"><label>Sound-এর নাম</label><input id="sName" placeholder="যেমন: Viral Whoosh">
 <label>Category</label><select id="sCat"><option>UI</option><option>Premium</option><option>Transition</option><option>Game</option></select>
 <label>Audio File</label><input id="sFile" type="file" accept="audio/*">
 <button class="primary" onclick="addSound()">＋ Save Sound</button>
 <button class="primary danger" onclick="clearCustom()">Custom sounds মুছুন</button></div>
 <div class="notice">${svgIcon('sliders',16)}<span>Tip: audio file সিলেক্ট করে নাম দিন, Save চাপুন। Audio IndexedDB-তে রাখা হয়—localStorage-এর ছোট quota সীমা আর নেই।</span></div>`;
}
async function addSound(){
 const name=sName.value.trim(),file=sFile.files[0],cat=sCat.value;
 if(!name||!file)return toast('নাম ও audio file দিন');
 if(file.size>50*1024*1024)return toast('৫০MB-এর কম audio দিন');
 const id='custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);
 try{
   await putAudioBlob(id,file);
   const meta={id,name,category:cat,seed:false,views:0};
   customMeta.push(meta); saveData();
   sounds.push({...meta,file:URL.createObjectURL(file)});
   closeModal();render();toast('Sound যোগ হয়েছে ✓');
   await notifyNewSound(name);
 }catch(e){toast('Audio save করা যায়নি');}
}
async function clearCustom(){
 if(!confirm('শুধু admin-added custom sounds মুছবেন?'))return;
 for(const s of sounds.filter(x=>!x.seed)) await deleteAudioBlob(s.id).catch(()=>{});
 sounds=sounds.filter(s=>s.seed); customMeta=[]; saveData(); closeModal(); render(); toast('Custom sounds removed');
}
function showSaved(){
 const ids=JSON.parse(localStorage.getItem('lyunaSaved')||'[]'),arr=sounds.filter(s=>ids.includes(s.id));
 currentCat='__saved';document.getElementById('sectionTitle').textContent='Saved Sounds';document.getElementById('count').textContent=arr.length+' saved';
 document.getElementById('chips').innerHTML=`<button class="chip active">${svgIcon('bookmark',13,'currentColor','none')} Saved</button>`;
 document.getElementById('grid').innerHTML=arr.length?arr.map(s=>cardHTML(s,ids)).join(''):emptyState('এখনো কোনো sound save করা হয়নি।');
 if(currentPlayingId)setPlayingUI(currentPlayingId,true)
 scrollTop()
}
function goHome(){currentCat='All';document.getElementById('search').value='';renderChips();render();document.getElementById('sectionTitle').textContent='Latest Sounds';scrollTop()}

/* ---------- static icon injection (nav / header) ---------- */
document.getElementById('coinIcon').innerHTML = svgIcon('coin',15,'currentColor','none') + ' 50';
document.querySelector('.icon-btn').innerHTML = svgIcon('sliders',19);
document.getElementById('installBtn').insertAdjacentHTML('afterbegin', svgIcon('download',20,'currentColor','none'));
document.getElementById('search').insertAdjacentHTML('beforebegin', svgIcon('search',18));
document.getElementById('navHome').innerHTML = svgIcon('home',21) + 'Home';
document.getElementById('navCat').innerHTML = svgIcon('grid',21) + 'Categories';
document.getElementById('navTrend').innerHTML = svgIcon('trend',21) + 'Trending';
document.getElementById('navSaved').innerHTML = svgIcon('bookmark',21) + 'Saved';
document.getElementById('navProfile').innerHTML = svgIcon('sliders',21) + 'Profile';

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').style.display='flex'})
document.getElementById('installBtn').onclick=async()=>{
 if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null}
 else toast('Chrome menu থেকে “Add to Home screen / Install app” দিন')
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(()=>{
    try{
      notificationChannel=new BroadcastChannel('fx-sharaf-notifications');
      notificationChannel.onmessage=e=>{if(e.data?.type==='new-sound')toast('🔔 নতুন music: '+e.data.name)}
    }catch(e){}
  }).catch(()=>{});
}
initStorage();
</script>
</body></html>
